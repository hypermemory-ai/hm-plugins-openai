interface:
  display_name: "HyperMemory Writer"
  short_description: "Finalize durable memory after each turn"
  default_prompt: "Use $memory-writer to persist this bounded turn summary."

dependencies:
  tools:
    - type: "mcp"
      value: "hypermemory"
      description: "OAuth-protected HyperMemory graph and token telemetry"
      transport: "streamable_http"
      url: "https://api.hypermemory.io/mcp"

policy:
  allow_implicit_invocation: false
